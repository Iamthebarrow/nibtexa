<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>Math editor</title>
  <link rel="stylesheet" href="page.css">
  <script src="bridge.js"></script>
  <script src="mathlive/mathlive.min.js"></script>
  <script src="mathlive-config.js"></script>
</head>
<body>
  <math-field id="field" math-virtual-keyboard-policy="auto" aria-label="Equation"></math-field>
  <script src="mathfield.js"></script>
</body>
</html>
