server.document-root = "/srv/www"
server.port = 8080
server.errorlog = "/dev/stderr"
accesslog.filename = "/dev/stdout"
# mod_auth comes from Alpine's lighttpd-mod_auth package.
server.modules = ("mod_auth", "mod_authn_file", "mod_alias", "mod_setenv", "mod_cgi", "mod_accesslog")

# /git/<repo>.git/... goes to git-http-backend, behind Basic auth.
alias.url = ("/git" => "/usr/libexec/git-core/git-http-backend")
$HTTP["url"] =~ "^/git" {
    cgi.assign = ("" => "")
    setenv.add-environment = (
        "GIT_PROJECT_ROOT" => "/srv/git",
        "GIT_HTTP_EXPORT_ALL" => "1",
    )
    auth.backend = "plain"
    auth.backend.plain.userfile = "/etc/lighttpd/users"
    auth.require = ("" => ("method" => "basic", "realm" => "nibtexa-test", "require" => "valid-user"))
}
